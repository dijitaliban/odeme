<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soner & Erva</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 3rem;
            margin-top: 50px;
            font-family: 'Georgia', serif;
            color: #2c3e50;
            letter-spacing: 2px;
        }
        .photos {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .photos img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 6px solid white;
            transition: transform 0.3s ease;
        }
        .photos img:hover {
            transform: scale(1.05);
        }
        .counter-box {
            background: white;
            padding: 30px 50px;
            border-radius: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 40px;
        }
        .counter-box h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .time {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 15px 0 0 0;
            color: #e74c3c;
        }
        .quote-box {
            max-width: 650px;
            padding: 25px;
            font-size: 1.4rem;
            font-style: italic;
            background: rgba(255, 255, 255, 0.8);
            border-left: 5px solid #e74c3c;
            border-radius: 10px;
            margin-bottom: 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            color: #34495e;
        }
    </style>
</head>
<body>

    <h1>Soner & Erva</h1>

    <div class="photos">
        <img src="AI.jpg" alt="Soner ve Erva">
        <img src="4b86ec5b-2e62-403d-9c17-f008e6d6c924.webp" alt="Soner ve Erva Çizim">
    </div>

    <div class="counter-box">
        <h2>Birlikte Geçen Zamanımız</h2>
        <div id="timer" class="time">Hesaplanıyor...</div>
    </div>

    <div class="quote-box" id="daily-quote">
        Sevgi sözü yükleniyor...
    </div>

    <script>
        const startDate = new Date("2024-09-09T00:00:00").getTime();

            const now = new Date().getTime();
            const difference = now - startDate;

            const seconds = Math.floor((difference % (1000 * 60)) / 1000);
