<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamu Maliyesi Klasik Vize Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
            padding: 20px;
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            border-bottom: 2px solid #111;
            padding-bottom: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stats {
            font-size: 0.9rem;
            font-weight: 600;
            background: #f4f4f5;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #fff;
            border: 1px solid #d4d4d8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #111;
            color: #fff;
            border-color: #111;
        }
        .question-card {
            border: 1px solid #e4e4e7;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            background: #e4e4e7;
            color: #27272a;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        textarea {
            width: 100%;
            min-height: 130px;
            padding: 14px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            background: #fff;
            margin-bottom: 16px;
            outline: none;
        }
        textarea:focus {
            border-color: #111;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button.primary {
            background: #111;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        button.secondary {
            background: #fff;
            color: #111;
            border: 1px solid #111;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-box {
            display: none;
            border: 1px solid #e4e4e7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            background: #fff;
        }
        .score-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .score-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .score-high { background: #dcfce7; color: #166534; }
        .score-mid { background: #fef9c3; color: #854d0e; }
        .score-low { background: #fee2e2; color: #991b1b; }
        
        .keywords-section {
            margin: 14px 0;
            font-size: 0.9rem;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            margin: 3px 4px 3px 0;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .tag.hit { background: #dcfce7; color: #15803d; }
        .tag.miss { background: #fee2e2; color: #b91c1c; }
        
        .ideal-answer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #d4d4d8;
            font-size: 0.95rem;
        }
        .ideal-answer strong {
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kamu Maliyesi Vize Simülatörü</h1>
        <div class="stats" id="statsText">Çözülen: 0 | Ort: 0 Puan</div>
    </header>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="setCategory('all', this)">Tüm Konular</button>
        <button class="filter-btn" onclick="setCategory('1', this)">1. Bölüm: Giriş</button>
        <button class="filter-btn" onclick="setCategory('2', this)">2. Bölüm: Ekoller</button>
        <button class="filter-btn" onclick="setCategory('3', this)">3. Bölüm: Piyasa Başarısızlıkları</button>
    </div>

    <div class="question-card">
        <span class="badge" id="qCategory">1. Bölüm</span>
        <div class="question-text" id="qText">Soru yükleniyor...</div>
        
        <textarea id="userAnswer" placeholder="Klasik sınav kağıdına yazar gibi cevabını buraya yaz..."></textarea>
        
        <div class="btn-group">
            <button class="primary" onclick="evaluateAnswer()">Cevabı Puanla</button>
            <button class="secondary" onclick="nextQuestion()">Yeni Soru Oluştur ➔</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="score-header">
                <span>Sınav Puanın:</span>
                <span class="score-badge" id="scoreBadge">0 / 100</span>
            </div>
            
            <div class="keywords-section">
                <div><strong>Yakaladığın Anahtar Kavramlar:</strong> <span id="hitTags"></span></div>
                <div style="margin-top:8px;"><strong>Eksik Bıraktığın Kavramlar:</strong> <span id="missTags"></span></div>
            </div>

            <div class="ideal-answer">
                <strong>Tam Puanlık Cevap Anahtarı:</strong>
                <div id="idealText"></div>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            {
                cat: "1",
                catName: "1. Bölüm: Giriş ve Kapsam",
                q: "Kamu kesimini oluşturan birimleri (D-M-K-S-D-F) ve maliyenin temel konularını (İ-Ü-H-G-B) eksiksiz olarak yazınız.",
                keywords: [
                    { label: "Devlet", alts: ["devlet"] },
                    { label: "Mahalli İdareler", alts: ["mahalli", "belediye"] },
                    { label: "KİT", alts: ["kit", "iktisadi teşebbüs"] },
                    { label: "Sosyal Güvenlik", alts: ["sosyal güvenlik", "sgk"] },
                    { label: "Döner Sermaye", alts: ["döner sermaye"] },
                    { label: "Fonlar", alts: ["fon"] },
                    { label: "İhtiyaçlar / Üretim", alts: ["ihtiyaç", "üretim"] },
                    { label: "Harcama / Gelir", alts: ["harcama", "gelir"] },
                    { label: "Bütçe ve Borçlanma", alts: ["bütçe", "borç"] }
                ],
                ideal: "Kamu Kesimi (D-M-K-S-D-F): Devlet, Mahalli idareler, KİT, Sosyal Güvenlik Kurumları, Döner sermayeli kuruluşlar, Fonlar.<br>Maliye Konuları (İ-Ü-H-G-B): İhtiyaçlar, Üretim, Harcama, Gelirler, Bütçe ve Borçlanma."
            },
            {
                cat: "1",
                catName: "1. Bölüm: Giriş ve Yaklaşımlar",
                q: "Mali olayları incelerken kullanılan 'Pozitif' ve 'Normatif' yaklaşımları karşılaştırarak tanımlayınız.",
                keywords: [
                    { label: "Olanı İnceler (Pozitif)", alts: ["olanı", "ne olduğunu", "mevcut"] },
                    { label: "Değer Yargısız (Pozitif)", alts: ["değer yargısız", "tarafsız", "objektif"] },
                    { label: "Olması Gerekeni (Normatif)", alts: ["olması gereken"] },
                    { label: "Değer Yargılı (Normatif)", alts: ["değer yargı", "ahlaki", "subjektif"] }
                ],
                ideal: "Pozitif yaklaşım; mali olaylarda 'olanı, ne olduğunu' değer yargısız (objektif) inceler. Normatif yaklaşım ise 'olması gerekeni' değer yargılarıyla inceler."
            },
            {
                cat: "1",
                catName: "1. Bölüm: Temel Kavramlar",
                q: "Kamu kaynaklarının kullanımında 'Etkinlik', 'Etkililik' ve 'Verimlilik' kavramlarının farkını açıklayınız.",
                keywords: [
                    { label: "Kaynak İsraf Etmeme", alts: ["israf"] },
                    { label: "İşi Doğru Yapmak (Etkinlik)", alts: ["işi doğru", "doing things right"] },
                    { label: "Doğru İşleri Yapmak (Etkililik)", alts: ["doğru işler", "doing right things", "amaca ulaşma"] },
                    { label: "Az Girdiyle Çok Çıktı (Verimlilik)", alts: ["girdi", "çıktı"] }
                ],
                ideal: "Etkinlik: Kaynak israf etmeden işi doğru yapmaktır (doing things right).<br>Etkililik: Doğru işleri yapmaktır (doing right things).<br>Verimlilik: Az girdiyle çok çıktı almaktır."
            },
            {
                cat: "1",
                catName: "1. Bölüm: Özel vs. Kamu Kesimi",
                q: "Özel Kesim ile Kamu Kesimini amaç, karar mekanizması ve finansman biçimi yönünden karşılaştırınız.",
                keywords: [
                    { label: "Kâr Maksimizasyonu", alts: ["kar", "kâr"] },
                    { label: "Toplumsal Refah", alts: ["toplumsal refah", "sosyal fayda", "kamu yararı"] },
                    { label: "Fiyat Mekanizması", alts: ["fiyat mekanizması", "piyasa"] },
                    { label: "Siyasi Karar Mekanizması", alts: ["siyasi", "politik", "oy"] },
                    { label: "Gönüllü Finansman (Fiyat)", alts: ["gönüllü"] },
                    { label: "Zorunlu Finansman (Vergi)", alts: ["zorunlu", "vergi", "cebri"] }
                ],
                ideal: "Özel kesim kâr maksimizasyonu güder, fiyat mekanizması ve gönüllü finansman (fiyat) kullanır. Kamu kesimi ise toplumsal refahı maksimize eder, siyasi karar mekanizması ve zorunlu finansman (vergi) kullanır."
            },
            {
                cat: "2",
                catName: "2. Bölüm: İktisadi Ekoller",
                q: "Merkantilizm ve Fizyokrasi ekollerinin devlet müdahalesi, zenginlik kaynağı ve vergi hakkındaki görüşlerini yazınız.",
                keywords: [
                    { label: "Değerli Maden / Bulyonizm", alts: ["maden", "altın", "bulyonizm"] },
                    { label: "İhracatı Artırma / Korumacılık", alts: ["ihracat"] },
                    { label: "Aktif Devlet (Merkantilizm)", alts: ["aktif devlet", "müdahale"] },
                    { label: "Quesnay / Ekonomik Tablo", alts: ["quesnay", "ekonomik tablo"] },
                    { label: "Doğal Düzen / Bırakınız Yapsınlar", alts: ["doğal düzen", "bırakınız yapsınlar"] },
                    { label: "Tarım ve Tek Vergi", alts: ["tarım", "tek vergi"] }
                ],
                ideal: "Merkantilizm: Değerli maden biriktirme (Bulyonizm), ihracatı artırma ve aktif devlet müdahalesini savunur.<br>Fizyokrasi: Kurucusu Dr. François Quesnay ('Ekonomik Tablo' - 1758). Doğal düzen, bırakınız yapsınlar ilkesi, tek üretken sektör olan tarım ve tarımdan alınan tek vergiyi savunur."
            },
            {
                cat: "2",
                catName: "2. Bölüm: İktisadi Ekoller",
                q: "Klasik İktisat Okulunun temel ilkelerini, devlet, bütçe ve vergi anlayışını açıklayınız.",
                keywords: [
                    { label: "Adam Smith / Ulusların Zenginliği", alts: ["adam smith", "ulusların zenginliği"] },
                    { label: "Görünmez El", alts: ["görünmez el"] },
                    { label: "Say Kanunu (Her arz kendi talebini yaratır)", alts: ["say kanunu", "arz kendi talebini"] },
                    { label: "Tam İstihdam", alts: ["tam istihdam"] },
                    { label: "Jandarma Devlet", alts: ["jandarma"] },
                    { label: "Tarafsız Vergi", alts: ["tarafsız vergi"] },
                    { label: "Denk Bütçe", alts: ["denk bütçe", "denk"] }
                ],
                ideal: "Kurucusu Adam Smith (1776 - Ulusların Zenginliği). Görünmez el, Say Kanunu (her arz kendi talebini yaratır), tam istihdam dengesi, jandarma devlet, tarafsız vergi ve denk bütçe ilkelerini savunur."
            },
            {
                cat: "2",
                catName: "2. Bölüm: İktisadi Ekoller",
                q: "Neoklasik İktisat (Marjinalistler) ile Keynesyen İktisadın devlete bakış açısını ve Keynes'in kriz reçetesini açıklayınız.",
                keywords: [
                    { label: "Marjinal Fayda (Marshall, Walras, Pareto, Pigou)", alts: ["marjinal fayda", "pigou", "pareto", "marshall", "walras"] },
                    { label: "İyiliksever Devlet (Neoklasik)", alts: ["iyiliksever", "piyasa başarısızlıklarını düzelten"] },
                    { label: "1929 Krizi ve J. M. Keynes", alts: ["1929", "keynes", "genel teori"] },
                    { label: "Efektif Talep Yetersizliği", alts: ["efektif talep", "talep yetersizliği"] },
                    { label: "Eksik İstihdam", alts: ["eksik istihdam"] },
                    { label: "Açık Bütçe Politikası", alts: ["açık bütçe"] },
                    { label: "Pump Priming (Tulumbaya Dökülen Su)", alts: ["pump priming", "tulumba", "can suyu"] }
                ],
                ideal: "Neoklasikler: Marjinal fayda analizini kullanır, devleti 'piyasa başarısızlıklarını düzelten iyiliksever devlet' olarak görür.<br>Keynesyen İktisat (1929 Krizi): Efektif talep yetersizliği ve eksik istihdam vardır. Açık bütçe politikası, pump priming (tulumbaya dökülen su) ve aktif müdahaleci devlet uygulanmalıdır."
            },
            {
                cat: "2",
                catName: "2. Bölüm: 1970 Sonrası Modeller",
                q: "1970 sonrası gelişen Monetarizm, Arz Yönlü İktisat ve Kamusal Seçiş yaklaşımlarının temel görüşlerini açıklayınız.",
                keywords: [
                    { label: "Friedman / Enflasyon Parasaldır", alts: ["friedman", "parasal", "para arzı"] },
                    { label: "Dışlama Etkisi (Crowding-out)", alts: ["dışlama", "crowding"] },
                    { label: "Laffer Eğrisi / Vergi İndirimi", alts: ["laffer", "vergi oranları düşürülmeli"] },
                    { label: "Buchanan / Devlet Başarısızlığı", alts: ["buchanan", "devlet başarısızlığı", "kendi çıkar"] },
                    { label: "Oy Ticareti (Logrolling) ve Rant Kollama", alts: ["oy ticareti", "logrolling", "rant kollama"] },
                    { label: "Anayasal Sınır", alts: ["anayasal"] }
                ],
                ideal: "Monetarizm (Friedman): Enflasyon parasaldır, para arzı sabit artmalı, maliye politikası dışlama (crowding-out) yapar.<br>Arz Yönlü (Laffer Eğrisi): Yüksek vergi üretimi engeller, vergiler düşürülmelidir.<br>Kamusal Seçiş (Buchanan): Siyasetçi ve bürokratlar kendi çıkarını düşünür (devlet başarısızlığı), oy ticareti (logrolling) ve rant kollaması vardır; anayasal sınır şarttır."
            },
            {
                cat: "3",
                catName: "3. Bölüm: Piyasa Başarısızlıkları",
                q: "Piyasa başarısızlıklarının nedenlerini (K-D-T-E-B) sıralayınız ve Pareto Optimumu kavramını tanımlayınız.",
                keywords: [
                    { label: "Kamusal Mallar", alts: ["kamusal mal"] },
                    { label: "Dışsallıklar", alts: ["dışsallık"] },
                    { label: "Tekeller (Doğal Tekel)", alts: ["tekel"] },
                    { label: "Eksik Piyasalar", alts: ["eksik piyasa"] },
                    { label: "Asimetrik Bilgi", alts: ["asimetrik bilgi"] },
                    { label: "Kimsenin Refahını Azaltmadan (Pareto)", alts: ["refahı azaltılmadan", "refahını azaltmadan", "başkasının refahı"] },
                    { label: "Tam Etkinlik Durumu", alts: ["tam etkinlik", "bir kişinin refahını artırma"] }
                ],
                ideal: "Piyasa Başarısızlıkları (K-D-T-E-B): Kamusal mallar, Dışsallıklar, Tekeller (doğal tekel), Eksik piyasalar, Asimetrik bilgi.<br>Pareto Optimumu: Hiç kimsenin refahı azaltılmadan en az bir kişinin refahını artırmanın imkansız olduğu tam etkinlik durumudur."
            },
            {
                cat: "3",
                catName: "3. Bölüm: Tüketimde Etkinlik ve Paternalizm",
                q: "Marjinal İkame Haddini (MHxy) ve Tüketimde Etkinlik koşulunu yazınız. Paternalist Devlet anlayışını açıklayınız.",
                keywords: [
                    { label: "Farksızlık Eğrisinin Eğimi", alts: ["farksızlık eğrisi", "eğimi"] },
                    { label: "Vazgeçmeye Razı Olduğu Miktar", alts: ["vazgeçme", "aynı tatmin"] },
                    { label: "Formül: MHa = MHb = Px/Py", alts: ["px/py", "fiyat oranı", "mha", "mhb"] },
                    { label: "Bireyler Adına Tercih Belirleme (Paternalist)", alts: ["tercih", "aciz", "baba"] },
                    { label: "Erdemli Malları Zorunlu Kılma", alts: ["erdemli"] },
                    { label: "Erdemsiz Malları Yasaklama", alts: ["erdemsiz", "yasak"] }
                ],
                ideal: "Marjinal İkame Haddi (MHxy): Farksızlık eğrisinin eğimidir; tüketicinin aynı tatmin düzeyinde kalmak için 1 birim fazla X malı karşılığında vazgeçmeye razı olduğu Y malı miktarıdır. Koşul: MHa = MHb = Px / Py.<br>Paternalist Devlet: Halkın kendi kararlarını veremeyecek kadar aciz olduğu düşüncesiyle devletin bireyler adına tercih belirlemesidir (erdemli malları zorunlu kılma, erdemsiz malları yasaklama)."
            }
        ];

        let currentCategory = 'all';
        let currentQuestion = null;
        let lastIndex = -1;
        let solvedCount = 0;
        let totalScore = 0;

        function normalizeTR(str) {
            return str.toLocaleLowerCase('tr-TR')
                      .replace(/â/g, 'a')
                      .replace(/î/g, 'i')
                      .replace(/û/g, 'u');
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            nextQuestion();
        }

        function nextQuestion() {
            const pool = currentCategory === 'all' 
                ? questionBank 
                : questionBank.filter(q => q.cat === currentCategory);
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * pool.length);
            } while (pool.length > 1 && pool[randomIndex] === currentQuestion);

            currentQuestion = pool[randomIndex];
            
            document.getElementById('qCategory').textContent = currentQuestion.catName;
            document.getElementById('qText').textContent = currentQuestion.q;
            document.getElementById('userAnswer').value = '';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('userAnswer').focus();
        }

        function evaluateAnswer() {
            const rawText = document.getElementById('userAnswer').value.trim();
            if (!rawText) {
                alert("Önce cevabını yaz kanka!");
                return;
            }

            const normText = normalizeTR(rawText);
            let hits = [];
            let misses = [];

            currentQuestion.keywords.forEach(kw => {
                const matched = kw.alts.some(alt => normText.includes(normalizeTR(alt)));
                if (matched) {
                    hits.push(kw.label);
                } else {
                    misses.push(kw.label);
                }
            });

            const score = Math.round((hits.length / currentQuestion.keywords.length) * 100);
            
            solvedCount++;
            totalScore += score;
            const avg = Math.round(totalScore / solvedCount);
            document.getElementById('statsText').textContent = `Çözülen: ${solvedCount} | Ort: ${avg} Puan`;

            const badge = document.getElementById('scoreBadge');
            badge.textContent = `${score} / 100`;
            badge.className = 'score-badge ' + (score >= 75 ? 'score-high' : score >= 45 ? 'score-mid' : 'score-low');

            document.getElementById('hitTags').innerHTML = hits.length 
                ? hits.map(h => `<span class="tag hit">✓ ${h}</span>`).join('') 
                : '<span style="color:#71717a;">Hiç anahtar kelime yakalanamadı.</span>';

            document.getElementById('missTags').innerHTML = misses.length 
                ? misses.map(m => `<span class="tag miss">✗ ${m}</span>`).join('') 
                : '<span style="color:#15803d;font-weight:600;">Eksik yok, tam puan!</span>';

            document.getElementById('idealText').innerHTML = currentQuestion.ideal;
            document.getElementById('resultBox').style.display = 'block';
        }

        // İlk soruyu yükle
        nextQuestion();
    </script>
</body>
</html>
